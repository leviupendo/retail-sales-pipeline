name: 'retail_dw'
version: '1.0.0'
profile: 'retail_dw'

model-paths: ["models"]
seed-paths: ["seeds"]
test-paths: ["tests"]
macro-paths: ["macros"]

clean-targets: ["target", "dbt_packages"]

vars:
  # Calendar range for dim_date (the dataset covers 2010-12-01 .. 2011-12-09)
  calendar_start: '2010-12-01'
  calendar_end: '2011-12-31'

models:
  retail_dw:
    staging:
      +materialized: view
      +schema: staging
    intermediate:
      +materialized: view
      +schema: staging
    marts:
      +materialized: table
      +schema: marts

seeds:
  retail_dw:
    +schema: staging
    non_product_stock_codes:
      +column_types:
        stock_code: text
        description: text
        category: text
